name: Build upstream bundles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'templates/**'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional upstream tag, for example JSignPdf_3_1_0
        required: false
        type: string
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: jsignpdf-upstream-bundles
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify macOS Apple Silicon bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_bundle.sh "${{ inputs.upstream_tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/VERSION

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Linux x64 bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_linux.sh "${{ inputs.upstream_tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/VERSION

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Windows x64 bundle
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_windows.ps1 "${{ inputs.upstream_tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/VERSION

  release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: release
      - name: Publish new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat release/VERSION)"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release/*.zip release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" release/*.zip release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "JSignPDF All-in-One $VERSION" \
              --notes "Automated macOS Apple Silicon, Windows x64, and Linux x64 bundles based on upstream JSignPDF $VERSION, with embedded Java runtimes and HYP2003 PKCS#11 support."
          fi
